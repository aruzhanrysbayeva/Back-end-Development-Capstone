apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: djangoserver
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
      - image: djangoserver:1
        imagePullPolicy: Always
        name: djangoserver
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: DJANGO_DEBUG
          value: "0"
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-config
              key: secret-key
        - name: DJANGO_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: allowed-hosts
        - name: SONGS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: songs-url
        - name: PICTURES_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: django-config
              key: pictures-url
      restartPolicy: Always
